  <style>
    @property --accent-hue {
      syntax: '<number>';
      initial-value: 220;
      inherits: true;
    }
    @keyframes cycleAccent {
      0%   { --accent-hue: 220; }
      33%  { --accent-hue: 258; }
      66%  { --accent-hue: 160; }
      100% { --accent-hue: 220; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #050508;
      color: #EDEDED;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cycleAccent 20s ease-in-out infinite;
      -webkit-font-smoothing: antialiased;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.035;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 3rem 1.5rem 2rem;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Profile */
    .profile {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.5s ease-out both;
    }
    .profile__logo {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #EDEDED;
      letter-spacing: -0.02em;
    }
    .profile__logo span {
      color: hsl(var(--accent-hue), 100%, 55%);
    }
    .profile__name {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 0.75rem;
      color: #EDEDED;
    }
    .profile__subtitle {
      font-size: 0.875rem;
      color: #A1A1A6;
      margin-top: 0.35rem;
      font-weight: 300;
    }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: #141415;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #EDEDED;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
      opacity: 0;
      animation: fadeUp 0.4s ease-out both;
    }
    .link-card:nth-child(1) { animation-delay: 0.1s; }
    .link-card:nth-child(2) { animation-delay: 0.18s; }
    .link-card:nth-child(3) { animation-delay: 0.26s; }
    .link-card:nth-child(4) { animation-delay: 0.34s; }
    .link-card:nth-child(5) { animation-delay: 0.42s; }
    .link-card:nth-child(6) { animation-delay: 0.50s; }
    .link-card:nth-child(7) { animation-delay: 0.58s; }
    .link-card:hover {
      border-color: hsla(var(--accent-hue), 100%, 55%, 0.4);
      box-shadow: 0 0 30px hsla(var(--accent-hue), 100%, 55%, 0.1);
      transform: scale(1.02);
    }
    .link-card__arrow {
      color: #545456;
      font-size: 1.1rem;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .link-card:hover .link-card__arrow {
      color: hsl(var(--accent-hue), 100%, 55%);
      transform: translateX(3px);
    }

    /* Footer */
    .footer {
      margin-top: auto;
      padding: 2rem 0 1.5rem;
      font-size: 0.75rem;
      color: #545456;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.5s ease-out 0.7s both;
    }
  </style>
</head>
